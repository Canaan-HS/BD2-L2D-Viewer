name: Sync Upstream

on:
  schedule:
    # 台灣時間 00:00 (UTC+8) = UTC 16:00
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Jelosus2/BD2-L2D-Viewer
  REVIEW_TITLE: 同步更新審查

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check SYNC_TOKEN is configured
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "${SYNC_TOKEN}" ]; then
            echo "::error title=缺少 SYNC_TOKEN::請到 Settings → Secrets and variables → Actions → New repository secret 建立「SYNC_TOKEN」,內容為 fine-grained token,權限勾選 Contents: Read and write 與 Pull requests: Read and write。"
            exit 1
          fi

      - name: Compare with upstream
        id: compare
        uses: actions/github-script@v7
        env:
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          script: |
            const [upOwner, upRepo] = process.env.UPSTREAM_REPO.split('/')
            const { owner, repo } = context.repo

            const { data } = await github.request(
              'GET /repos/{owner}/{repo}/compare/{basehead}',
              {
                owner: upOwner,
                repo: upRepo,
                basehead: `main...${owner}:main`,
              },
            )

            core.setOutput('behind_by', String(data.behind_by))
            core.setOutput('ahead_by', String(data.ahead_by))
            core.setOutput('compare_url', data.html_url)

      - name: Merge upstream via GitHub native sync
        id: merge
        if: steps.compare.outputs.behind_by != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          script: |
            const { owner, repo } = context.repo
            let result = 'unknown'

            try {
              await github.request(
                'POST /repos/{owner}/{repo}/merge-upstream',
                { owner, repo, branch: 'main', merge_method: 'merge' },
              )
              result = 'merged'
            } catch (err) {
              if (err.status === 409) {
                result = 'conflict'
              } else if (err.status === 422) {
                result = 'noop'
              } else {
                core.setFailed(`merge-upstream 失敗:HTTP ${err.status} ${err.message}`)
                return
              }
            }

            core.setOutput('result', result)

      - name: Verify merge was recorded
        if: steps.merge.outputs.result == 'merged'
        uses: actions/github-script@v7
        env:
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          script: |
            const [upOwner, upRepo] = process.env.UPSTREAM_REPO.split('/')
            const { owner, repo } = context.repo

            const { data } = await github.request(
              'GET /repos/{owner}/{repo}/compare/{basehead}',
              {
                owner: upOwner,
                repo: upRepo,
                basehead: `main...${owner}:main`,
              },
            )

            if (data.behind_by !== 0) {
              core.setFailed(
                `合併後驗證失敗:仍落後 ${data.behind_by} 個 commit,merge commit 可能沒有建立`,
              )
            }

      - name: Open or update review pull request
        if: steps.merge.outputs.result == 'conflict'
        uses: actions/github-script@v7
        env:
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          REVIEW_TITLE: ${{ env.REVIEW_TITLE }}
          BEHIND_BY: ${{ steps.compare.outputs.behind_by }}
          AHEAD_BY: ${{ steps.compare.outputs.ahead_by }}
          COMPARE_URL: ${{ steps.compare.outputs.compare_url }}
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          script: |
            const { owner, repo } = context.repo
            const [upOwner, upRepo] = process.env.UPSTREAM_REPO.split('/')
            const head = `${upOwner}:main`
            const title = process.env.REVIEW_TITLE

            const body = [
              `上游 \`${process.env.UPSTREAM_REPO}\` 有新的 commit 需要合併。`,
              '',
              `- 落後 **${process.env.BEHIND_BY}** 個 commit ／ 領先 **${process.env.AHEAD_BY}** 個 commit`,
              '- 自動同步偵測到衝突,已中止並移交本 PR 處理。',
              '',
              `**完整差異**:${process.env.COMPARE_URL}`,
              '',
              '## 處理方式',
              '',
              '1. 在本 PR 的 **Files changed** 分頁解決衝突。',
              '2. 確認自己客製化的檔案沒被上游蓋掉。',
              '3. 按 **Merge pull request**。',
              '',
              '合併會建立 merge commit,GitHub 落後數歸零,',
              'GitHub Pages 也會由這次 push 自動重新部署。',
            ].join('\n')

            const open = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              head,
              base: 'main',
              per_page: 100,
            })

            if (open.length) {
              const { data: pr } = await github.request(
                'PATCH /repos/{owner}/{repo}/pulls/{pull_number}',
                { owner, repo, pull_number: open[0].number, title, body },
              )
              core.info(`已更新既有 PR #${pr.number},請解決衝突後合併`)
              return
            }

            try {
              const { data: pr } = await github.request(
                'POST /repos/{owner}/{repo}/pulls',
                {
                  owner,
                  repo,
                  title,
                  body,
                  head,
                  base: 'main',
                  maintainer_can_modify: true,
                },
              )
              core.info(`已建立審查 PR #${pr.number},請解決衝突後合併`)
            } catch (err) {
              core.setFailed(`無法建立跨 fork PR:HTTP ${err.status} ${err.message}`)
            }
